{% extends "monitoreo/base.html" %}
{% block titulo %}Eliminar vehículo{% endblock %}
{% block contenido %}
<h1 class="h4 mb-3">Eliminar vehículo</h1>
<div class="tarjeta" style="max-width:520px;">
  <p>¿Confirmas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-verde">Sí, eliminar</button>
    <a href="{% url 'monitoreo:vehiculo_lista' %}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
