# ============================================================================
#  Broker MQTT Mosquitto — Sistema de Monitoreo Vehicular Inteligente (UCSM)
# ============================================================================
#  Arranque manual (sin instalar el servicio de Windows):
#     infra\mosquitto\iniciar_mosquitto.bat
#  Prueba:
#     mosquitto_sub -h 127.0.0.1 -u servidor -P <clave> -t "ucsm/v1/#" -v
#
#  Usuarios (ver infra\mosquitto\passwd, creado con mosquitto_passwd):
#     nodo01    -> nodo ESP32-S3   (solo ucsm/v1/NODO-01/#)
#     cam01     -> cámara ESP32-CAM (solo ucsm/v1/NODO-01/#)
#     servidor  -> servidor Django  (todo ucsm/v1/#)
# ============================================================================

# Escucha en todas las interfaces de la LAN (el firmware se conecta a la IP de la PC).
listener 1883 0.0.0.0

# Nunca anónimo: el nodo y la cámara llevan usuario/contraseña en el firmware.
allow_anonymous false

password_file D:\Tesis_2026\SV_INTERFAZ_UCSM\infra\mosquitto\passwd
acl_file D:\Tesis_2026\SV_INTERFAZ_UCSM\infra\mosquitto\acl

# Los mensajes retenidos (estado, modo, config, cam/estado) sobreviven a un
# reinicio del broker, así el nodo recibe su configuración vigente al conectar.
persistence true
persistence_location D:\Tesis_2026\SV_INTERFAZ_UCSM\infra\mosquitto\

# Registro en archivo (útil para el capítulo de pruebas de la tesis).
log_dest file D:\Tesis_2026\SV_INTERFAZ_UCSM\logs\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Keepalive de 15 s en los clientes => el Last Will se publica en ~22 s como máximo.
max_keepalive 65

# Los payloads del sistema son pequeños (telemetría ~1.5 KB); 8 KB es de sobra.
message_size_limit 8192
